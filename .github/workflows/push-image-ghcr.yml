# Build and push the builder image to ghcr.io/octopilot/builder-jammy-base.
# Use this workflow to publish the forked builder so you can use octopilot/builder-jammy-base.
name: Push Builder Image to GHCR

on:
  push:
    branches: [main, rust-builder]
    paths:
      - "builder.toml"
      - ".github/workflows/push-image-ghcr.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: from release or 'latest')"
        required: false
        default: ""

env:
  IMAGE: ghcr.io/octopilot/builder-jammy-base

jobs:
  push:
    name: Build and Push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Floor: octopilot/rust 0.1.13 is the first buildpack that both registers
      # launch processes and leaves /workspace traversable. 0.1.0 renames the
      # binary to bin/web and writes launch.toml in the wrong directory.
      # octopilot-pipeline-tools/docs/image-launch-and-builder-tags.md
      - name: Require a builder that can launch Rust binaries
        run: |
          python3 - << 'PY'
          import pathlib, sys
          text = pathlib.Path("builder.toml").read_text()
          lines = text.splitlines()
          rust = None
          helm = False
          for i, line in enumerate(lines):
              if 'id = "octopilot/rust"' in line:
                  for nxt in lines[i:i + 4]:
                      if nxt.strip().startswith("version"):
                          rust = nxt.split("=", 1)[1].strip().strip('"')
                          break
              if 'id = "octopilot/helm"' in line:
                  helm = True
          def parts(v):
              return tuple(int(p) for p in v.split("."))
          if rust is None or parts(rust) < (0, 1, 13):
              sys.exit(
                  f"refusing to publish: octopilot/rust {rust!r} is below 0.1.13 "
                  "(launch processes and /workspace mode 0755)."
              )
          if not helm:
              sys.exit("refusing to publish: octopilot/helm is not in the order")
          print(f"builder ok: octopilot/rust {rust}, helm present")
          PY

      - name: Set tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            t="${GITHUB_REF#refs/tags/}"
            echo "tag=${t#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            else
              echo "tag=${GITHUB_REF#refs/heads/}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          source "./scripts/.util/tools.sh"
          util::tools::pack::install --directory "./.bin" --token ""
          util::tools::crane::install --directory "./.bin"
          export PATH="${PWD}/.bin:${PATH}"

      - name: Create builder image and push to GHCR
        run: |
          ./scripts/publish.sh \
            --builder-toml-path "./builder.toml" \
            --builder-image-ref "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"

      - name: Tag as latest
        if: steps.tag.outputs.tag != 'latest'
        run: |
          export PATH="${PWD}/.bin:${PATH}"
          ./.bin/crane copy "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}" "${{ env.IMAGE }}:latest"
